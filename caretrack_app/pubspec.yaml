name: caretrack_app
description: "CareTrack — Doctor Follow-up & Patient Reminder Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  file_picker: ^8.1.2
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  url_launcher: ^6.3.0
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

dependency_overrides:
  cross_file: 0.3.4+2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

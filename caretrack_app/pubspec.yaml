name: caretrack_app
description: "CareTrack — Doctor Follow-up & Patient Reminder Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.4
  firebase_messaging: ^15.1.3
  provider: ^6.1.2
  intl: ^0.19.0
  file_picker: ^8.1.2
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  cross_file: 0.3.4+2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/render_service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    # Never auto-merge; keep major versions isolated for manual review & testing
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
